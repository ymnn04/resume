<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人简历 · Resume</title>
<meta name="description" content="个人简历页面 · Resume">
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#fafafa; --fg:#1a1a1a; --muted:#6b7280; --line:#e5e7eb;
  --accent:#0969da; --card:#ffffff; --shadow:0 1px 3px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0d1117; --fg:#e6edf3; --muted:#9da7b3; --line:#30363d; --accent:#58a6ff; --card:#161b22;}
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--fg);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:980px; margin:0 auto; padding:48px 24px 80px}
header{margin-bottom:32px; padding-bottom:24px; border-bottom:1px solid var(--line)}
h1{font-size:32px; font-weight:600; margin-bottom:8px; letter-spacing:-.5px}
.tagline{color:var(--muted); font-size:15px}
.actions{display:flex; gap:12px; margin-top:20px; flex-wrap:wrap}
.btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 16px; border-radius:6px;
  font-size:14px; text-decoration:none;
  border:1px solid var(--line); color:var(--fg);
  background:var(--card); transition:all .15s;
}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn-primary{background:var(--accent); color:#fff; border-color:transparent}
.btn-primary:hover{filter:brightness(1.1); color:#fff}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin:24px 0}
.card{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; box-shadow:var(--shadow)}
.card h3{font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-bottom:6px; font-weight:500}
.card p{font-size:14px}
.pdf-frame{
  width:100%; height:calc(100vh - 200px); min-height:680px;
  border:1px solid var(--line); border-radius:8px;
  background:var(--card); margin-top:16px;
}
footer{margin-top:48px; padding-top:24px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>个人简历</h1>
    <p class="tagline">点这里直接看 / 下载 PDF 原件；GitHub Pages 自动部署。</p>
    <div class="actions">
      <a class="btn btn-primary" href="./resume.pdf" target="_blank" rel="noopener">在新标签页打开 PDF</a>
      <a class="btn" href="./resume.pdf" download>下载 resume.pdf</a>
      <a class="btn" href="https://github.com/ymnn04/resume" target="_blank" rel="noopener">查看源代码</a>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <h3>本页路径</h3>
      <p id="url">ymnn04.github.io/resume</p>
    </div>
    <div class="card">
      <h3>文件名</h3>
      <p>resume.pdf</p>
    </div>
    <div class="card">
      <h3>最近更新</h3>
      <p id="updated">—</p>
    </div>
  </div>

  <iframe class="pdf-frame" src="./resume.pdf" title="个人简历预览"></iframe>

  <footer>
    Maintained by <a href="https://github.com/ymnn04" style="color:var(--accent)">@ymnn04</a> ·
    Deployed via GitHub Pages
  </footer>
</div>

<script>
  document.getElementById('url').textContent = location.host + location.pathname.replace(/\/$/, '');
  fetch('./resume.pdf', {method:'HEAD'}).then(r=>{
    const lm = r.headers.get('last-modified');
    if(lm){ document.getElementById('updated').textContent = new Date(lm).toLocaleDateString('zh-CN'); }
  }).catch(()=>{});
</script>
</body>
</html>
